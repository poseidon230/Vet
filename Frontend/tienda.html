<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare Aserrí - Tienda</title>
    <link rel="stylesheet" href="../Frontend/CSS/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo"><a href="index.html">🏥 VetCare <span>Aserrí</span></a></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="./tienda.html" class="active">Tienda</a></li>
                    <li><a href="./login.html" style="color: #ff4d4d; font-weight: 700;">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="tienda-wrapper">
        <section class="tienda-banner">
            <h2>Catálogo de Productos</h2>
            <p>Alimentos, medicamentos y accesorios conectados directamente en tiempo real con MongoDB Atlas.</p>
        </section>

        <div class="productos-grid" id="contenedor-productos">
            <p style="grid-column: 1/-1; text-align: center; color: #777;">Cargando inventario desde la nube...</p>
        </div>
    </main>

    <div id="modalPago" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px;">
        <div class="login-card" style="max-width: 450px; position: relative; background: white; padding: 30px; border-radius: 8px;">
            <span onclick="cerrarPasarela()" style="position: absolute; top: 10px; right: 20px; font-size: 1.6rem; cursor: pointer; color: #aaa; font-weight: bold;">&times;</span>
            <h2 style="font-size: 1.4rem; text-align: center; margin-bottom: 5px;">💳 Pasarela de Pago Segura</h2>
            <p id="pagoInfoProducto" style="text-align: center; font-weight: 600; color: #00c3b5; margin-bottom: 20px; font-size: 0.95rem;"></p>
            
            <form id="pasarelaForm">
                <div class="form-group">
                    <label>Nombre del Titular:</label>
                    <input type="text" placeholder="EJ. JUAN PÉREZ" required style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Número de Tarjeta:</label>
                    <input type="text" maxlength="16" placeholder="4000123456789010" required pattern="\d{16}" title="Deben ser los 16 números corridos de la tarjeta">
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Vencimiento:</label>
                        <input type="text" placeholder="MM/AA" maxlength="5" required pattern="(0[1-9]|1[0-2])\/?([0-9]{2})" title="Formato MM/AA">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>CVV:</label>
                        <input type="password" maxlength="3" placeholder="123" required pattern="\d{3}" title="Código de seguridad de 3 dígitos">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Confirmar y Pagar Orden</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 VetCare Aserrí. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../Frontend/JS/main.js"></script>
</body>
</html>
