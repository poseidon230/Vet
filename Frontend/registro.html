<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare Aserrí - Registro</title>
    <link rel="stylesheet" href="../Frontend/CSS/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo"><a href="../index.html">🏥 VetCare <span>Aserrí</span></a></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="./tienda.html">Tienda</a></li>
                    <li><a href="./login.html">Ingresar</a></li>
                    <li><a href="./registro.html" class="active">Registrarse</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>Crear Cuenta Nueva</h2>
            <p style="text-align: center; margin-bottom: 20px; color: #777;">Regístrate para conectarte directamente con MongoDB Atlas.</p>
            
            <form id="registroForm">
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="regNombre" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="regEmail" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Número de Teléfono:</label>
                    <input type="tel" id="regTelefono" placeholder="Ej: 8888-8888" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="regPassword" placeholder="Crea una contraseña segura" required>
                </div>
                <button type="submit" class="btn-submit">Registrarse</button>
            </form>
            
            <p id="registroMsg" class="success-msg"></p>
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                ¿Ya tienes una cuenta? <a href="./login.html" style="color: var(--cyan-primary); font-weight: 600; text-decoration: none;">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 VetCare Aserrí. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../Frontend/JS/main.js"></script>
</body>
</html>
