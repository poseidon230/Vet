<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare Aserrí - Ingresar</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo"><a href="../index.html">🏥 VetCare <span>Aserrí</span></a></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="tienda.html">Tienda</a></li>
                    <li><a href="login.html" class="active">Ingresar</a></li>
                    <li><a href="registro.html">Registrarse</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>Iniciar Sesión</h2>
            <p style="text-align: center; margin-bottom: 20px; color: #777;">Ingresa para gestionar tus compras o acceder al panel.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
            
            <p id="loginError" style="text-align: center; margin-top: 15px; color: #ff4d4d; font-weight: 600; min-height: 20px;"></p>
            
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                ¿No tienes una cuenta todavía? <a href="registro.html" style="color: #00c3b5; font-weight: 600; text-decoration: none;">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 VetCare Aserrí. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="JS/main.js"></script>
</body>
</html>
