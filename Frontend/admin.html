<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare Aserrí - Panel Admin</title>
    <link rel="stylesheet" href="../Frontend/CSS/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo"><a>⚙️ Panel de Control <span>Administrador</span></a></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="../Frontend/tienda.html">Ver Tienda</a></li>
                    <li><a href="../Frontend/login.html" style="color: #ff4d4d;">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card" style="max-width: 550px;">
            <h2>Subir Producto a MongoDB Atlas</h2>
            <p style="text-align: center; margin-bottom: 25px; color: #666;">Llena el formulario para inyectar un nuevo ítem en la base de datos de la nube.</p>
            
            <form id="productForm">
                <div class="form-group">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="prodNombre" placeholder="Ej: NutraCalm Bites Premium" required>
                </div>
                <div class="form-group">
                    <label>Precio (en Colones ₡):</label>
                    <input type="number" id="prodPrecio" placeholder="Ej: 8500" required>
                </div>
                <div class="form-group">
                    <label>Categoría del Producto:</label>
                    <select id="prodCategoria" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit;">
                        <option value="">-- Selecciona una categoría --</option>
                        <option value="Alimentos">Alimentos</option>
                        <option value="Medicamentos">Medicamentos</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Enlace (URL) de la Imagen del Producto:</label>
                    <input type="url" id="prodImagen" placeholder="https://ejemplo.com/foto.jpg" required>
                </div>

                <div class="form-group">
                    <label>Descripción Breve:</label>
                    <textarea id="prodDescripcion" placeholder="Escribe las características o indicaciones..." rows="3" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; resize: none;"></textarea>
                </div>
                <button type="submit" class="btn-submit" style="background-color: #85868b;">Guardar en MongoDB Atlas</button>
            </form>
            
            <p id="adminSuccess" style="text-align: center; margin-top: 15px; color: #00c3b5; font-weight: 600;"></p>
        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 VetCare Aserrí | Panel de Control Interno.</p>
        </div>
    </footer>

    <script src="../Frontend/JS/main.js"></script>
</body>
</html>
